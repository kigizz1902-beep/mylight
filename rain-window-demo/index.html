<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>반려 도깨비불 — 비 오는 밤</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="demo" aria-label="비 오는 밤의 반려 도깨비불 데모">
      <section class="scene" id="scene">
        <img
          class="scene-image scene-image--off"
          src="./assets/bed_2800x2160_light_off.webp"
          alt="조명이 꺼진 침실"
        />
        <img
          class="scene-image scene-image--on"
          src="./assets/bed_2800x2160_lamp_removed.webp"
          alt="조명이 켜진 침실"
        />

        <!-- 현재 이미지의 창문 유리 영역에만 겹쳐지는 비 레이어 -->
        <div class="rain-window" aria-hidden="true">
          <canvas id="rain-canvas"></canvas>
          <div class="window-haze"></div>
        </div>

        <div class="controls" aria-label="장면 제어">
          <button class="control-button" id="lamp-button" type="button">
            조명 끄기
          </button>
          <button class="control-button" id="rain-button" type="button">
            비 멈추기
          </button>
        </div>
      </section>
    </main>

    <script src="./rain.js"></script>
  </body>
</html>
